[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "learner"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
learner = "learner.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["learner*"]
